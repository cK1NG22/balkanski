<script>
        // Micro-interaction for the crest
        const crest = document.querySelector('img');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            crest.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            crest.style.transform = `rotateY(0deg) rotateX(0deg)`;
            crest.style.transition = 'all 0.5s ease';
        });

        crest.addEventListener('mouseenter', () => {
            crest.style.transition = 'none';
        });
    </script>
