[project]
name = "balkanski-pipeline"
version = "0.1.0"
description = "Frequency-rank + gloss + case-form ingestion pipeline for Balkanski"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balkanski_pipeline"]
